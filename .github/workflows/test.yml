name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra text
      - run: uv run pytest
      - run: uv run jjm evaluate --request examples/route-ticket.json
      - run: uv run python specs/jjm-spec-pack/scripts/validate_identity.py
