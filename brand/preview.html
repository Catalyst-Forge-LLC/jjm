<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JJM wordmark</title>
  <style>
    :root { --ink: #1a1916; --paper: #f3f0e8; --panel: #141311; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    section { padding: 64px 72px; }
    .wordmark {
      width: min(720px, 100%);
      aspect-ratio: 254 / 100;
      background: var(--ink);
      -webkit-mask: url("jjm-wordmark.svg") center / contain no-repeat;
      mask: url("jjm-wordmark.svg") center / contain no-repeat;
    }
    .lockup { margin-top: 22px; font-size: 13px; font-weight: 650; letter-spacing: 0.24em; text-transform: uppercase; }
    .dark { background: var(--panel); color: var(--paper); }
    .dark .wordmark { background: var(--paper); }
    .sizes { display: flex; align-items: end; gap: 36px; }
    .sizes .wordmark { width: auto; }
    .sizes img { display: block; }
    .construction { display: flex; gap: 36px; align-items: center; }
    .note { max-width: 460px; font-size: 16px; line-height: 1.45; }
    .labels { display: flex; gap: 24px; margin-top: 16px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; }
    .swatch { width: 10px; height: 10px; display: inline-block; margin-right: 8px; vertical-align: -1px; }
  </style>
</head>
<body>
  <section>
    <div class="wordmark" role="img" aria-label="JJM"></div>
    <div class="lockup">Just Judgment Model</div>
  </section>
  <section class="dark">
    <div class="wordmark" role="img" aria-label="JJM"></div>
  </section>
  <section>
    <div class="sizes">
      <img src="jjm-wordmark.svg" width="127" height="50" alt="">
      <img src="jjm-wordmark.svg" width="203" height="80" alt="">
      <img src="jjm-wordmark.svg" width="305" height="120" alt="">
      <img src="jjm-mark.svg" width="72" height="72" alt="JJM mark">
    </div>
  </section>
  <section>
    <div class="construction">
      <svg width="108" height="200" viewBox="0 0 54 100" aria-label="Segmented J">
        <rect x="20" y="0" width="34" height="14" fill="#1a1916"/>
        <rect x="36" y="21" width="18" height="79" fill="#8d877c"/>
        <rect y="82" width="54" height="18" fill="#8d877c"/>
      </svg>
      <div class="note">
        The gray body is a mirrored L. The black segment turns it into a J. Two of those beside an M read as JJM and rhyme with LLM.
        <div class="labels">
          <span><i class="swatch" style="background:#1a1916"></i>Segment</span>
          <span><i class="swatch" style="background:#8d877c"></i>Mirrored L</span>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
